# Compila la versión web y la publica en GitHub Pages cada vez que se sube algo a main.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # El yarn.lock generado en Windows no coincide con el de Linux; aquí solo se compila, así que se rehace.
      - name: Rehacer yarn.lock
        run: ./gradlew kotlinWasmUpgradeYarnLock
      - name: Tests del motor
        run: ./gradlew :engine:allTests
      - name: Compilar la web
        run: ./gradlew :shared:wasmJsBrowserDistribution
      - uses: actions/upload-pages-artifact@v3
        with:
          path: shared/build/dist/wasmJs/productionExecutable

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
